; Per-site PHP settings, mounted into the container as conf.d/zz-site.ini (loaded after php.ini).
; The image's php.ini is PHP's own php.ini-production; these are the docker-stack's changes to it.
; Edit this copy in <project>/php/php.ini, then reload:  docker compose kill -s SIGUSR2 php
expose_php = Off
error_log = /proc/self/fd/2

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.jit = off
opcache.jit_buffer_size = 0
